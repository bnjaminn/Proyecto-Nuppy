<!-- 
    =======================================================================
    Muestra el historial completo de cambios realizados en una calificación específica.
    
    REDISEÑO: Modal más amigable con tarjetas en lugar de tabla
    - Información de calificación destacada con iconos
    - Tarjetas de cambios más visuales y fáciles de leer
    - Mejor organización y espaciado
-->
<!-- Modal para mostrar logs de una calificación -->
<div id="log-calificacion-modal-overlay" class="modal-overlay">
    <div class="modal-content modal-extra-large">
        <!-- CABECERA DEL MODAL -->
        <div class="modal-header">
            <h2><i class="bi bi-clock-history" style="margin-right: 0.5rem;"></i>Historial de Cambios</h2>
            <span id="btn-cerrar-log-calificacion-x" class="modal-close">&times;</span>
        </div>
        
        <!-- CUERPO DEL MODAL: INFORMACIÓN Y LOGS -->
        <div class="modal-body" style="padding: 1.5rem;">
            <!-- INFORMACIÓN DE LA CALIFICACIÓN (Mejorada con iconos) -->
            <div id="log-calificacion-info" class="log-calificacion-info-card">
                <!-- Se llena dinámicamente con JavaScript -->
            </div>
            
            <!-- CONTENEDOR DE LOGS (Tarjetas en lugar de tabla) -->
            <div id="log-calificacion-container" style="max-height: 65vh; overflow-y: auto; margin-top: 1.5rem;">
                <!-- Se llena dinámicamente con JavaScript desde home.js -->
            </div>
        </div>

        <!-- PIE DEL MODAL: BOTÓN CERRAR -->
        <div class="modal-footer">
            <button type="button" id="btn-cerrar-log-calificacion" class="btn">Cerrar</button>
        </div>
    </div>
</div>
